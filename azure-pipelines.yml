trigger:
  branches:
    include:
      - main
      - develop
      - release/**
      - hotfix/**
  tags:
    include:
      - v*.*.*
      - v*.*.*-rc.*
  paths:
    exclude:
      - docs/**
      - README.md
      - CHANGELOG.md

pr:
  branches:
    include:
      - main
      - develop
      - release/**
  paths:
    exclude:
      - docs/**
      - README.md

variables:
  pythonVersion: '3.12'
  projectPath: 'src'
  testsPath: 'tests'
  artifactFeedName: 'itlusions-feed'
  REGISTRY_URL: 'https://pkgs.dev.azure.com/itlusions/_packaging/itlusions-feed/pypi/simple/'

extends:
  template: python-package-full-workflow.yml@self
  parameters:
    pythonVersion: '3.12'
    projectPath: 'src'
    testPath: 'tests'
    minCoveragePercent: 80
    enableSecurity: true
    publishRegistry: ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      PyPI
    else: ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/v') }}:
      PyPI
    else: ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release') }}:
      TestPyPI
    else:
      AzureArtifacts
