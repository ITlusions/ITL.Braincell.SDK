[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "itl-braincell-sdk"
dynamic = ["version"]
description = "BrainCell SDK — shared core library with cells, services, and data models for the ITL memory platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "weaviate-client>=4.19.2",
    "numpy>=1.26.4",
    "redis>=5.0.7",
    "aioredis>=2.0.1",
    "python-dotenv>=1.0.1",
    "python-json-logger>=2.0.7",
    "requests>=2.32.3",
    "aiohttp>=3.10.2",
    "structlog>=24.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["itl_braincell_sdk*"]

[tool.setuptools.package-data]
"itl_braincell_sdk" = ["*.sql", "*.json", "*.yaml", "*.yml"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "pip-audit>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
asyncio_mode = "auto"
addopts = "--cov=src/itl_braincell_sdk --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=0"

[tool.coverage.run]
branch = true
source = ["src/itl_braincell_sdk"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN", "RUF"]
ignore = ["E501", "ANN101"]

[tool.setuptools-scm]
write_to = "src/itl_braincell_sdk/_version.py"
write_to_template = '__version__ = "{version}"\n'
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:[a-zA-Z0-9\\-\\.]*)?)$"
