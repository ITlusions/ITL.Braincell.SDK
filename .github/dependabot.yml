version: 2

updates:
  # GitHub Actions updates (root level + workflows)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    commit-message:
      prefix: "ci"
      include: "scope"
    # Auto-merge safe, non-breaking updates
    auto-merge:
      - match:
          dependency-type: "patch"
      - match:
          dependency-type: "minor"

  # Python package dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    commit-message:
      prefix: "deps"
      include: "scope"
    # Auto-merge patch versions only (safe bugfixes)
    auto-merge:
      - match:
          dependency-type: "patch"
