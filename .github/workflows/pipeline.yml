name: Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'hotfix/**' ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - testpypi
          - pypi

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
    - run: python -c "from itl_braincell_sdk.core.config import Settings; print('OK')"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: pip install black mypy ruff bandit
    - run: black --check src/ || true
    - run: mypy src/ --ignore-missing-imports || true
    - run: bandit -r src/ || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        BRANCH="${{ github.ref_name }}"
        if [[ "$BRANCH" == "main" ]]; then
          NAME="braincell-sdk-wheel-${LATEST_TAG}"
        elif [[ "$BRANCH" == "develop" ]]; then
          NAME="braincell-sdk-wheel-${LATEST_TAG}-development"
        elif [[ "$BRANCH" == release/* ]]; then
          NAME="braincell-sdk-wheel-${LATEST_TAG}"
        else
          SHORT_SHA="${{ github.sha }}"; SHORT_SHA="${SHORT_SHA:0:7}"
          NAME="braincell-sdk-wheel-${LATEST_TAG}-${BRANCH}-${SHORT_SHA}"
        fi
        echo "artifact_name=${NAME}" >> $GITHUB_OUTPUT
      id: build
    - run: pip install --upgrade pip build && python -m build
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.artifact_name }}
        path: dist/
        retention-days: 30

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ build ]
    if: |
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: |
        BRANCH="${{ github.ref_name }}"
        TRIGGER="${{ github.event_name }}"
        MANUAL_TARGET="${{ github.event.inputs.publish_target }}"
        
        if [[ "$TRIGGER" == "release" ]]; then
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "PUBLISH_TO=testpypi" >> $GITHUB_ENV
          else
            echo "PUBLISH_TO=pypi" >> $GITHUB_ENV
          fi
        elif [[ "$MANUAL_TARGET" != "auto" && "$MANUAL_TARGET" != "" ]]; then
          echo "PUBLISH_TO=$MANUAL_TARGET" >> $GITHUB_ENV
        else
          if [[ "$BRANCH" == feature/* ]]; then
            echo "PUBLISH_TO=testpypi" >> $GITHUB_ENV
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "PUBLISH_TO=pypi" >> $GITHUB_ENV
          else
            echo "PUBLISH_TO=none" >> $GITHUB_ENV
          fi
        fi
      id: target
    - run: pip install --upgrade pip build && python -m build
    - uses: pypa/gh-action-pypi-publish@release/v1
      if: env.PUBLISH_TO == 'testpypi'
      with:
        repository-url: https://test.pypi.org/legacy/
      continue-on-error: true
    - uses: pypa/gh-action-pypi-publish@release/v1
      if: env.PUBLISH_TO == 'pypi'
      continue-on-error: true
    - run: echo "Published to ${{ env.PUBLISH_TO }}"
