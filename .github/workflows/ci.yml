name: CI - Test and Validate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'hotfix/**' ]
  workflow_dispatch:

jobs:
  ci:
    uses: ITlusions/ITL.Github/.github/workflows/_reusable-python-ci.yml@v0.2.3
    with:
      python_version: '3.12'
      test_import_path: 'itl_braincell_sdk.core.config'
      test_import_class: 'Settings'
      src_directory: 'src'
