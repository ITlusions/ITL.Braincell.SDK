name: CI - Test and Validate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'hotfix/**' ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Test imports
      run: python -c "from itl_braincell_sdk.core.config import Settings; print('Imports OK')"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install black mypy ruff bandit
    
    - name: Format check
      run: black --check src/ || true
    
    - name: Type check
      run: mypy src/itl_braincell_sdk --ignore-missing-imports || true
    
    - name: Security scan
      run: bandit -r src/ || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Get version and branch info
      id: version
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        BRANCH="${{ github.ref_name }}"
        
        if [[ "$BRANCH" == "main" ]]; then
          ARTIFACT_NAME="braincell-sdk-wheel-${LATEST_TAG}"
        elif [[ "$BRANCH" == "develop" ]]; then
          ARTIFACT_NAME="braincell-sdk-wheel-${LATEST_TAG}-development"
        elif [[ "$BRANCH" == release/* ]]; then
          ARTIFACT_NAME="braincell-sdk-wheel-${LATEST_TAG}"
        else
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          ARTIFACT_NAME="braincell-sdk-wheel-${LATEST_TAG}-${BRANCH}-${SHORT_SHA}"
        fi
        
        echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
    
    - name: Build wheel
      run: |
        pip install --upgrade pip build
        python -m build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.artifact_name }}
        path: dist/
        retention-days: 30
