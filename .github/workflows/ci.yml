name: CI - Test and Validate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'hotfix/**' ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run SDK validation tests
      run: python test_sdk.py
    
    - name: Run pytest (if tests exist)
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v --cov=src/itl_braincell_sdk --cov-report=term-missing
        else
          echo "No pytest directory found, skipping pytest"
        fi
      shell: bash
    
    - name: Run type checking
      run: mypy src/itl_braincell_sdk --ignore-missing-imports
    
    - name: Check code formatting
      run: black --check src/ examples/ test_sdk.py
    
    - name: Test import and basic functionality
      run: |
        python -c "
        from itl_braincell_sdk.core.config import Settings
        print('Core imports successful')
        
        config = Settings()
        print('Configuration loading successful')
        
        print('SDK basic functionality test passed')
        "
    
    - name: Test examples
      run: |
        if [ -d "examples" ] && [ -f "examples/quickstart.py" ]; then
          cd examples && python quickstart.py
        else
          echo "No examples/quickstart.py found"
        fi
      shell: bash

  package-build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    outputs:
      artifact-name: braincell-sdk-wheel
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Build distribution packages
      run: |
        python -m pip install --upgrade pip build
        python -m build
    
    - name: Verify wheel contents
      run: |
        python -m pip install wheel
        python -c "
        import zipfile
        import glob
        whl = glob.glob('dist/*.whl')[0]
        with zipfile.ZipFile(whl) as z:
            files = z.namelist()
            print('Wheel package structure:')
            for f in sorted(files)[:10]:
                print(f'  {f}')
            if len(files) > 10:
                print(f'  ... and {len(files) - 10} more files')
        "
    
    - name: Test package installation in clean venv
      run: |
        python -m venv test-env
        source test-env/bin/activate
        pip install --upgrade pip
        pip install dist/*.whl
        python -c "from itl_braincell_sdk.core.config import Settings; print('Package installation successful')"
        deactivate
      shell: bash
    
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: braincell-sdk-wheel
        path: dist/itl_braincell_sdk-*.whl
        retention-days: 30
        if-no-files-found: error

  lint-and-security:
    name: Security and Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pip-audit

    - name: Install package dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run bandit security linter
      run: |
        echo "Running bandit security linter..."
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ 

    - name: Run safety check for dependencies
      run: |
        echo "Checking dependency vulnerabilities..."
        safety check --json --output safety-report.json || true
        safety check

    - name: Run pip-audit for vulnerability scanning
      run: |
        echo "Scanning for known vulnerabilities..."
        pip-audit --format=json --output=audit-report.json || true
        pip-audit

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          audit-report.json
        retention-days: 30
