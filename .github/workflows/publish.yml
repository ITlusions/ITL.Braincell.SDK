name: Publish - Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - testpypi
          - pypi

env:
  PYTHON_VERSION: '3.12'

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Determine publish target
      id: target
      run: |
        BRANCH="${{ github.ref_name }}"
        TRIGGER="${{ github.event_name }}"
        MANUAL_TARGET="${{ github.event.inputs.publish_target }}"
        
        if [[ "$TRIGGER" == "release" ]]; then
          # GitHub Release event: use prerelease flag
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "publish_to=testpypi" >> $GITHUB_OUTPUT
            echo "publish_reason=GitHub Release (prerelease)" >> $GITHUB_OUTPUT
          else
            echo "publish_to=pypi" >> $GITHUB_OUTPUT
            echo "publish_reason=GitHub Release (stable)" >> $GITHUB_OUTPUT
          fi
        elif [[ "$MANUAL_TARGET" != "auto" ]]; then
          # Manual workflow_dispatch with explicit target
          echo "publish_to=$MANUAL_TARGET" >> $GITHUB_OUTPUT
          echo "publish_reason=Manual override: $MANUAL_TARGET" >> $GITHUB_OUTPUT
        else
          # Manual workflow_dispatch with auto: detect from branch
          if [[ "$BRANCH" == feature/* ]]; then
            echo "publish_to=testpypi" >> $GITHUB_OUTPUT
            echo "publish_reason=Feature branch ($BRANCH)" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "publish_to=pypi" >> $GITHUB_OUTPUT
            echo "publish_reason=Hotfix branch ($BRANCH)" >> $GITHUB_OUTPUT
          else
            echo "publish_to=none" >> $GITHUB_OUTPUT
            echo "publish_reason=Branch $BRANCH not configured for publishing" >> $GITHUB_OUTPUT
          fi
        fi
    
    - name: Build distribution
      run: |
        python -m pip install --upgrade pip build
        python -m build
        ls -lah dist/
    
    - name: Publish to TestPyPI (prerelease)
      if: steps.target.outputs.publish_to == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
      continue-on-error: true
    
    - name: Publish to PyPI (stable)
      if: steps.target.outputs.publish_to == 'pypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
      continue-on-error: true
    
    - name: Publish result
      run: |
        TARGET="${{ steps.target.outputs.publish_to }}"
        REASON="${{ steps.target.outputs.publish_reason }}"
        
        if [[ "$TARGET" == "testpypi" ]]; then
          echo "Published to TestPyPI (Prerelease)"
          echo "Reason: $REASON"
        elif [[ "$TARGET" == "pypi" ]]; then
          echo "Published to PyPI (Stable)"
          echo "Reason: $REASON"
        else
          echo "Not published: $REASON"
        fi
