name: Publish - Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Build distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        ls -lah dist/
    
    - name: Publish to TestPyPI (prerelease)
      if: github.event.release.prerelease
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
      run: |
        python -m twine upload --repository testpypi dist/* --non-interactive --skip-existing
      continue-on-error: true
    
    - name: Publish to PyPI (stable)
      if: github.event.release != null && !github.event.release.prerelease
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        python -m twine upload dist/* --non-interactive --skip-existing
      continue-on-error: true
    
    - name: Publish success
      run: |
        TARGETS="PyPI"
        if ${{ github.event.release.prerelease }}; then TARGETS="TestPyPI"; fi
        echo "Package published to $TARGETS"
        echo "See: ${{ github.server_url }}/${{ github.repository }}/releases"
