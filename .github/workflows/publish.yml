name: Publish - Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Build distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        ls -lah dist/
    
    - name: Publish to GitHub Packages
      env:
        TWINE_REPOSITORY_URL: https://upload.github.com/packages/python
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python -m twine upload dist/* --non-interactive --skip-existing
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
      continue-on-error: true
    
    - name: Publish success
      run: |
        echo "Package published to GitHub Packages"
        echo "GitHub Packages: pip install --index-url https://github.com/ITlusions/ITL.Braincell.SDK/python itl-braincell-sdk"
        echo "PyPI: pip install itl-braincell-sdk"
        echo "See: ${{ github.server_url }}/${{ github.repository }}/releases"
