name: Publish - PyPI Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      pypi-environment:
        description: 'PyPI environment'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

env:
  PYTHON_VERSION: '3.12'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.pypi-environment || (github.event.release.prerelease && 'testpypi' || 'pypi') }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: braincell-sdk-wheel
        path: dist/
      continue-on-error: true
    
    - name: Build distributions (if artifact not found)
      if: failure()
      run: |
        python -m pip install --upgrade pip build
        python -m build
    
    - name: Publish to PyPI
      if: github.event.release != null && !github.event.release.prerelease
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
    
    - name: Publish to TestPyPI
      if: |
        (github.event.release != null && github.event.release.prerelease) ||
        github.event.inputs.pypi-environment == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
    
    - name: Publish success
      run: |
        REPO=${{ github.event.release != null && !github.event.release.prerelease && 'PyPI' || 'TestPyPI' }}
        echo "Package published to $REPO"
        echo "See: ${{ github.server_url }}/${{ github.repository }}/releases"
